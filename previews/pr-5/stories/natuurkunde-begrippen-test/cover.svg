    <path d="M40 270h250" stroke="#cbd5f5" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 320h200" stroke="#cbd5f5" stroke-width="6" stroke-linecap="round"/>
    <rect x="280" y="40" width="140" height="90" rx="18" fill="url(#accent)" opacity="0.95"/>
    <text x="350" y="97" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle">OK</text>
