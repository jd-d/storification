<!DOCTYPE html>
<html lang="nl" style="--tweak-font-size: 13.1px; --tweak-line-height: 1.15; --tweak-columns: 5; --tweak-margin-x: 7mm; --tweak-margin-y: 7mm; --tweak-gap: 10px;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grieks naar Nederlands - zelftoets printblad selectie</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --page-w: 297mm;
    --page-h: 210mm;
    --paper-bg: #fff;
    --screen-bg: #f4f1fb;
    --ink: #1c1c28;
    --muted: #6b5f78;
    --panel: #ffffff;
    --border: #e3def4;
  }
  html, body {
    margin: 0;
    padding: 0;
    color: var(--ink);
    background: var(--screen-bg);
    font-family: "Lexend", "Segoe UI", Verdana, Arial, sans-serif;
  }
  .topbar {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 20px 8px;
    color: #4a4459;
    font-size: 13px;
    line-height: 1.35;
  }
  .topbar a { color: #6d4aff; text-decoration: none; }
  .topbar a:hover { text-decoration: underline; }
  .topbar p { margin: 6px 0 0; }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    justify-content: center;
    max-width: 1120px;
    margin: 0 auto 12px;
    padding: 10px 12px;
    background: rgba(255,255,255,.96);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(54,38,110,.08);
  }
  .control {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    font-size: 12px;
    color: #3b3448;
  }
  .control strong { min-width: 68px; font-weight: 700; }
  .control output {
    min-width: 44px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: #39246e;
    font-weight: 700;
  }
  button {
    appearance: none;
    border: 1px solid #d7d0ec;
    background: #fff;
    color: #2d2540;
    border-radius: 9px;
    padding: 5px 8px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #f3efff; }
  button.primary {
    border-color: #6d4aff;
    background: #6d4aff;
    color: white;
    font-weight: 700;
  }
  .page-note {
    min-width: 86px;
    text-align: center;
    font-size: 12px;
    color: #6b5f78;
  }
  #pages {
    display: grid;
    gap: 18px;
    justify-content: center;
    padding: 0 18px 36px;
  }
  .print-page {
    width: var(--page-w);
    height: var(--page-h);
    padding: var(--tweak-margin-y) var(--tweak-margin-x);
    background: var(--paper-bg);
    border: 1px solid #ded8ef;
    box-shadow: 0 5px 22px rgba(54,38,110,.14);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .page-head { flex: 0 0 auto; }
  .banner {
    display: flex;
    align-items: baseline;
    justify-content: center;
    margin: 0 0 5px 0;
    padding: 3px 0;
    border-radius: 10px;
    background: linear-gradient(90deg, #ffe066 0%, #ff8787 25%, #f783ac 50%, #9775fa 75%, #4dabf7 100%);
  }
  .banner h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    color: #1c1c28;
    background: #fff;
    padding: 4px 12px;
    border-radius: 8px;
    text-align: center;
  }
  .hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .flow {
    flex: 1 1 auto;
    min-height: 0;
    height: 0;
    column-count: var(--tweak-columns);
    column-gap: var(--tweak-gap);
    column-fill: auto;
    overflow: hidden;
  }
  .entry {
    display: grid;
    grid-template-columns: 14px minmax(0, 58%) 1fr;
    column-gap: 5px;
    align-items: baseline;
    break-inside: avoid;
    page-break-inside: avoid;
    -webkit-column-break-inside: avoid;
    padding: 2px 3px;
    border-bottom: 0.5px dotted #ddd;
    border-left: 2.5px solid var(--c, #ccc);
    margin: 0 0 0.5px;
    font-size: var(--tweak-font-size);
    line-height: var(--tweak-line-height);
  }
  .l {
    font-size: 0.78em;
    color: #888;
    font-weight: 600;
  }
  .g {
    font-family: "Gentium Plus", "Cambria", "Georgia", serif;
    font-weight: 700;
    color: #1c1c28;
    overflow-wrap: anywhere;
  }
  .d {
    min-height: 1em;
    border-left: 1px dashed #c3c3cf;
    padding-left: 4px;
  }
  .d.blank {
    align-self: stretch;
    border-bottom: 1.2px dotted #9c96ab;
  }
  .screen-page-number {
    position: absolute;
    right: 6mm;
    bottom: 3mm;
    color: #b0a9bf;
    font-size: 10px;
  }

  .entry { position: relative; }
  .row-remove {
    position: absolute;
    top: 50%;
    right: 2px;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    display: inline-grid;
    place-items: center;
    border: 1px solid #e2d8f5;
    background: rgba(255,255,255,.92);
    color: #8d2d5a;
    border-radius: 999px;
    padding: 0;
    font-size: 12px;
    line-height: 1;
    font-weight: 800;
    opacity: .48;
    z-index: 2;
  }
  .row-remove:hover {
    opacity: 1;
    background: #fff0f5;
    border-color: #ffb3c8;
    color: #c2255c;
  }
  .removed-panel {
    position: fixed;
    right: 14px;
    bottom: 14px;
    width: min(440px, calc(100vw - 28px));
    max-height: min(560px, calc(100vh - 28px));
    z-index: 9999;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    background: #fff;
    border: 1px solid #d8cdf4;
    border-radius: 16px;
    box-shadow: 0 12px 34px rgba(54,38,110,.28);
  }
  .removed-panel.open { display: flex; }
  .removed-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .removed-panel h2 {
    margin: 0;
    font-size: 15px;
    color: #39246e;
  }
  .removed-panel-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .removed-list {
    display: grid;
    gap: 6px;
    overflow: auto;
    padding-right: 2px;
  }
  .removed-item {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px 7px;
    border: 1px solid #eee8fa;
    border-left: 3px solid var(--c, #ccc);
    border-radius: 10px;
    background: #fffafc;
    font-size: 12px;
  }
  .removed-item .removed-lesson {
    color: #888;
    font-weight: 700;
  }
  .removed-item .removed-greek {
    font-family: "Gentium Plus", "Cambria", "Georgia", serif;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .removed-empty {
    padding: 12px;
    color: #6b5f78;
    background: #f8f5ff;
    border: 1px dashed #d8cdf4;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.35;
  }

  /* lesson colour accents */
  .L2  { --c: #ff6b6b; }
  .L3  { --c: #ffa94d; }
  .L4  { --c: #ffd43b; }
  .L6  { --c: #94d82d; }
  .L7  { --c: #20c997; }
  .L8  { --c: #22b8cf; }
  .L9  { --c: #4dabf7; }
  .L11 { --c: #748ffc; }
  .L12 { --c: #9775fa; }
  .L13 { --c: #da77f2; }
  .L14 { --c: #f783ac; }
  .L16 { --c: #ff8787; }
  .L17 { --c: #63e6be; }
  .L18 { --c: #74c0fc; }
  .L19 { --c: #b197fc; }
  template { display: none; }

  @page { size: A4 landscape; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .topbar, .toolbar, .row-remove, .removed-panel { display: none !important; }
    #pages { display: block; padding: 0; }
    .print-page {
      width: 297mm;
      height: 210mm;
      border: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .print-page:last-child { page-break-after: auto; break-after: auto; }
    .screen-page-number { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="vocab-greek-nl-print-all.html">Terug naar menu</a>
    <p>Zelftoets: vul de Nederlandse vertaling in op de gestippelde lijn. De pagina's hieronder worden opnieuw opgebouwd wanneer je lettergrootte of kolommen wijzigt.</p>
  </div>

  <div class="toolbar" aria-label="Printinstellingen">
    <span class="control"><strong>Letter</strong><button type="button" data-action="font-down">A-</button><output id="fontOut">13.1px</output><button type="button" data-action="font-up">A+</button></span>
    <span class="control"><strong>Kolommen</strong><button type="button" data-action="cols-down">-</button><output id="colsOut">5</output><button type="button" data-action="cols-up">+</button></span>
    <span class="control"><strong>Regel</strong><button type="button" data-action="line-down">-</button><output id="lineOut">1.15</output><button type="button" data-action="line-up">+</button></span>
    <span class="control"><strong>Marge</strong><button type="button" data-action="margin-down">-</button><output id="marginOut">7mm</output><button type="button" data-action="margin-up">+</button></span>
    <span class="page-note" id="pageOut">2 pagina's</span>
    <button type="button" data-action="removed-menu">Verwijderd: <span id="removedCount">0</span></button>
    <button type="button" data-action="reset">Reset</button>
    <button type="button" data-action="save-new-html">Save as new HTML</button>
    <button type="button" class="primary" data-action="print">Print</button>
  </div>

  <aside class="removed-panel" id="removedPanel" aria-label="Verwijderde woordparen" aria-hidden="true">
    <div class="removed-panel-header">
      <h2>Verwijderde paren</h2>
      <div class="removed-panel-actions">
        <button type="button" data-action="restore-all">Alles terug</button>
        <button type="button" data-action="close-removed">Sluit</button>
      </div>
    </div>
    <div class="removed-list" id="removedList"></div>
  </aside>

  <main id="pages" aria-live="polite"></main>

<div class="entry L18"><span class="l">18</span><span class="g">ἔφηνα</span><span class="d blank">&nbsp;</span></div>

<div class="entry L18"><span class="l">18</span><span class="g">νέμω</span><span class="d blank">&nbsp;</span></div>

<div class="entry L19"><span class="l">19</span><span class="g">αἱ Ἀθῆναι</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ὁ Ἀθηναῖος</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἀναγιγνώσκω</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἀνέγνων</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἆρ’ οὐ(κ);</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἆρα μή;</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">δοκέω</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">δράω</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἐάω</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἔδοξα</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἐκάλεσα</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἔπεισα</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἐτέλεσα</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἤγγειλα</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">καλέω</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">κρατέω</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">λυπέω</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">πείθω</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">ἡ στρατιά</span><span class="d blank">&nbsp;</span></div>
<div class="entry L19"><span class="l">19</span><span class="g">τελέω</span><span class="d blank">&nbsp;</span></div>
  </template>

<script>
(function () {
  const defaults = { font: 13.1, line: 1.15, cols: 5, margin: 7, gap: 10, removed: [] };
  const limits = {
    font: [8, 22],
    line: [1.02, 1.55],
    cols: [2, 8],
    margin: [3, 18]
  };
  const key = 'greek-nl-selftest-print-v2-mqs5km75';
  const legacyKey = 'greek-nl-selftest-print-v2-mqs5km75-legacy';
  const root = document.documentElement;
  const pages = document.getElementById('pages');
  const source = document.getElementById('entrySource');
  const removedPanel = document.getElementById('removedPanel');
  const removedList = document.getElementById('removedList');
  const removedCount = document.getElementById('removedCount');
  const outs = {
    font: document.getElementById('fontOut'),
    line: document.getElementById('lineOut'),
    cols: document.getElementById('colsOut'),
    margin: document.getElementById('marginOut'),
    page: document.getElementById('pageOut')
  };
  let state = loadState();
  let scheduled = false;
  let sourceEntries = [];

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

  function normalizeState(raw) {
    const next = Object.assign({}, defaults, raw || {});
    next.removed = Array.isArray(next.removed) ? next.removed.slice() : [];
    return next;
  }

  function loadState() {
    try {
      const modern = localStorage.getItem(key);
      if (modern) return normalizeState(JSON.parse(modern));
      const legacy = localStorage.getItem(legacyKey);
      if (legacy) return normalizeState(JSON.parse(legacy));
      return normalizeState({});
    } catch (e) {
      return normalizeState({});
    }
  }

  function saveState() {
    localStorage.setItem(key, JSON.stringify(state));
  }

  function entryId(el, index) {
    const lesson = (el.querySelector('.l') && el.querySelector('.l').textContent.trim()) || '';
    const greek = (el.querySelector('.g') && el.querySelector('.g').textContent.trim()) || '';
    return 'entry-' + index + '-' + lesson + '-' + greek.replace(/\s+/g, '-');
  }

  function readSourceEntries() {
    sourceEntries = Array.from(source.content.querySelectorAll('.entry')).map((el, index) => {
      const clone = el.cloneNode(true);
      const id = entryId(clone, index);
      clone.dataset.entryId = id;
      clone.dataset.entryIndex = String(index);
      return {
        id,
        index,
        lesson: (clone.querySelector('.l') && clone.querySelector('.l').textContent.trim()) || '',
        greek: (clone.querySelector('.g') && clone.querySelector('.g').textContent.trim()) || '',
        className: clone.className,
        node: clone
      };
    });
  }

  function removedSet() {
    return new Set(state.removed || []);
  }

  function applyState() {
    state.font = clamp(Number(state.font) || defaults.font, limits.font[0], limits.font[1]);
    state.line = clamp(Number(state.line) || defaults.line, limits.line[0], limits.line[1]);
    state.cols = Math.round(clamp(Number(state.cols) || defaults.cols, limits.cols[0], limits.cols[1]));
    state.margin = clamp(Number(state.margin) || defaults.margin, limits.margin[0], limits.margin[1]);
    state.removed = Array.isArray(state.removed) ? state.removed.filter(id => sourceEntries.some(e => e.id === id)) : [];
    root.style.setProperty('--tweak-font-size', state.font.toFixed(1) + 'px');
    root.style.setProperty('--tweak-line-height', state.line.toFixed(2));
    root.style.setProperty('--tweak-columns', String(state.cols));
    root.style.setProperty('--tweak-margin-x', state.margin.toFixed(0) + 'mm');
    root.style.setProperty('--tweak-margin-y', state.margin.toFixed(0) + 'mm');
    root.style.setProperty('--tweak-gap', state.gap + 'px');
    outs.font.textContent = state.font.toFixed(1) + 'px';
    outs.line.textContent = state.line.toFixed(2);
    outs.cols.textContent = String(state.cols);
    outs.margin.textContent = state.margin.toFixed(0) + 'mm';
    updateRemovedUI();
  }

  function addRemoveButton(item) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'row-remove';
    btn.setAttribute('aria-label', 'Verwijder dit woordpaar');
    btn.title = 'Verwijder dit paar';
    btn.textContent = '×';
    btn.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      removeEntry(item.dataset.entryId);
    });
    item.appendChild(btn);
  }

  function getEntries() {
    const hidden = removedSet();
    return sourceEntries
      .filter(entry => !hidden.has(entry.id))
      .map(entry => {
        const clone = entry.node.cloneNode(true);
        clone.dataset.entryId = entry.id;
        return clone;
      });
  }

  function makePage(pageNo) {
    const page = document.createElement('section');
    page.className = 'print-page';
    page.setAttribute('aria-label', 'Pagina ' + pageNo);
    if (pageNo === 1) {
      const head = document.createElement('div');
      head.className = 'page-head';
      head.innerHTML = '<div class="banner"><h1>🏛️ Grieks naar Nederlands - zelftoets</h1></div><p class="hint">Schrijf de Nederlandse vertaling op de stippellijn.</p>';
      page.appendChild(head);
    }
    const flow = document.createElement('div');
    flow.className = 'flow';
    page.appendChild(flow);
    const n = document.createElement('div');
    n.className = 'screen-page-number';
    n.textContent = 'pagina ' + pageNo;
    page.appendChild(n);
    return { page, flow };
  }

  function overflows(flow) {
    return flow.scrollWidth > flow.clientWidth + 2 || flow.scrollHeight > flow.clientHeight + 2;
  }

  function paginate() {
    scheduled = false;
    applyState();
    pages.innerHTML = '';
    const entries = getEntries();
    let i = 0;
    let pageNo = 1;
    while (i < entries.length) {
      const { page, flow } = makePage(pageNo);
      pages.appendChild(page);
      let added = 0;
      while (i < entries.length) {
        const item = entries[i].cloneNode(true);
        addRemoveButton(item);
        flow.appendChild(item);
        if (overflows(flow)) {
          flow.removeChild(item);
          break;
        }
        i += 1;
        added += 1;
      }
      if (added === 0 && i < entries.length) {
        const item = entries[i].cloneNode(true);
        addRemoveButton(item);
        flow.appendChild(item);
        i += 1;
      }
      pageNo += 1;
      if (pageNo > 20) break;
    }
    const count = pageNo - 1;
    outs.page.textContent = count + ' pagina' + (count === 1 ? '' : "'s");
    updateRemovedUI();
  }

  function schedulePaginate() {
    applyState();
    saveState();
    if (!scheduled) {
      scheduled = true;
      requestAnimationFrame(() => requestAnimationFrame(paginate));
    }
  }

  function removeEntry(id) {
    if (!id) return;
    const hidden = removedSet();
    hidden.add(id);
    state.removed = sourceEntries.filter(entry => hidden.has(entry.id)).map(entry => entry.id);
    schedulePaginate();
  }

  function restoreEntry(id) {
    state.removed = (state.removed || []).filter(existing => existing !== id);
    schedulePaginate();
  }

  function restoreAll() {
    state.removed = [];
    schedulePaginate();
  }

  function updateRemovedUI() {
    if (!removedList || !removedCount) return;
    const hidden = removedSet();
    const removedEntries = sourceEntries.filter(entry => hidden.has(entry.id));
    removedCount.textContent = String(removedEntries.length);
    removedList.innerHTML = '';
    if (!removedEntries.length) {
      const empty = document.createElement('div');
      empty.className = 'removed-empty';
      empty.textContent = 'Nog niets verwijderd. Klik op het kleine kruisje naast een woord om het uit deze printversie te halen.';
      removedList.appendChild(empty);
      return;
    }
    removedEntries.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'removed-item ' + entry.className.replace(/\bentry\b/g, '').trim();
      row.innerHTML = '<span class="removed-lesson">Les ' + entry.lesson + '</span><span class="removed-greek"></span><button type="button">Terug</button>';
      row.querySelector('.removed-greek').textContent = entry.greek;
      row.querySelector('button').addEventListener('click', () => restoreEntry(entry.id));
      removedList.appendChild(row);
    });
  }

  function toggleRemovedPanel(force) {
    const open = typeof force === 'boolean' ? force : !removedPanel.classList.contains('open');
    removedPanel.classList.toggle('open', open);
    removedPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
    updateRemovedUI();
  }


  function htmlEscapeAttr(value) {
    return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function saveAsNewHTML() {
    applyState();
    const keptEntries = sourceEntries.filter(entry => !removedSet().has(entry.id));
    const clone = document.documentElement.cloneNode(true);
    clone.style.setProperty('--tweak-font-size', state.font.toFixed(1) + 'px');
    clone.style.setProperty('--tweak-line-height', state.line.toFixed(2));
    clone.style.setProperty('--tweak-columns', String(state.cols));
    clone.style.setProperty('--tweak-margin-x', state.margin.toFixed(0) + 'mm');
    clone.style.setProperty('--tweak-margin-y', state.margin.toFixed(0) + 'mm');
    clone.style.setProperty('--tweak-gap', state.gap + 'px');

    const clonePages = clone.querySelector('#pages');
    if (clonePages) clonePages.innerHTML = '';

    const clonePanel = clone.querySelector('#removedPanel');
    if (clonePanel) {
      clonePanel.classList.remove('open');
      clonePanel.setAttribute('aria-hidden', 'true');
      const cloneList = clonePanel.querySelector('#removedList');
      if (cloneList) cloneList.innerHTML = '';
    }

    const cloneCount = clone.querySelector('#removedCount');
    if (cloneCount) cloneCount.textContent = '0';

    const cloneSource = clone.querySelector('#entrySource');
    if (cloneSource) {
      cloneSource.innerHTML = '\n' + keptEntries.map(entry => {
        const node = entry.node.cloneNode(true);
        node.removeAttribute('data-entry-id');
        node.removeAttribute('data-entry-index');
        node.querySelectorAll('.row-remove').forEach(btn => btn.remove());
        return node.outerHTML;
      }).join('\n') + '\n  ';
    }

    clone.querySelectorAll('.row-remove').forEach(btn => btn.remove());

    const scripts = clone.querySelectorAll('script');
    const script = scripts[scripts.length - 1];
    if (script) {
      const exportKey = 'greek-nl-selftest-print-v2-' + Date.now().toString(36);
      script.textContent = script.textContent
        .replace(/const defaults = \{ font: [^;]+;\n/, 'const defaults = { font: ' + state.font.toFixed(1) + ', line: ' + state.line.toFixed(2) + ', cols: ' + state.cols + ', margin: ' + state.margin.toFixed(0) + ', gap: ' + state.gap + ', removed: [] };\n')
        .replace(/const key = '[^']+';/, "const key = '" + exportKey + "';")
        .replace(/const legacyKey = '[^']+';/, "const legacyKey = '" + exportKey + "-legacy';");
    }

    const title = clone.querySelector('title');
    if (title) title.textContent = 'Grieks naar Nederlands - zelftoets printblad selectie';

    const kept = keptEntries.length;
    const total = sourceEntries.length;
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const filename = 'vocab-greek-nl-selftest-selection-' + kept + '-of-' + total + '-' + stamp + '.html';
    const blob = new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  document.querySelector('.toolbar').addEventListener('click', (ev) => {
    const action = ev.target && ev.target.closest('[data-action]') && ev.target.closest('[data-action]').getAttribute('data-action');
    if (!action) return;
    if (action === 'font-down') state.font -= 0.5;
    if (action === 'font-up') state.font += 0.5;
    if (action === 'cols-down') state.cols -= 1;
    if (action === 'cols-up') state.cols += 1;
    if (action === 'line-down') state.line -= 0.03;
    if (action === 'line-up') state.line += 0.03;
    if (action === 'margin-down') state.margin -= 1;
    if (action === 'margin-up') state.margin += 1;
    if (action === 'removed-menu') { toggleRemovedPanel(); return; }
    if (action === 'reset') state = Object.assign({}, defaults, { removed: state.removed || [] });
    if (action === 'save-new-html') { saveAsNewHTML(); return; }
    if (action === 'print') { window.print(); return; }
    schedulePaginate();
  });

  removedPanel.addEventListener('click', (ev) => {
    const action = ev.target && ev.target.closest('[data-action]') && ev.target.closest('[data-action]').getAttribute('data-action');
    if (!action) return;
    if (action === 'restore-all') restoreAll();
    if (action === 'close-removed') toggleRemovedPanel(false);
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') toggleRemovedPanel(false);
  });

  window.addEventListener('resize', schedulePaginate);
  readSourceEntries();
  applyState();
  saveState();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(paginate);
  } else {
    paginate();
  }
}());
</script>
