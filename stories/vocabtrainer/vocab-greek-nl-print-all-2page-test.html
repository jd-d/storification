<!DOCTYPE html>
<html lang="nl" style="--tweak-font-size:12.6px; --tweak-line-height:1.18; --tweak-columns:6; --tweak-margin-x:8mm; --tweak-margin-y:7mm; --tweak-gap:10px;">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grieks naar Nederlands - zelftoets printblad</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --page-w: 297mm;
    --page-h: 210mm;
    --paper-bg: #fff;
    --screen-bg: #f4f1fb;
    --ink: #1c1c28;
    --muted: #6b5f78;
    --panel: #ffffff;
    --border: #e3def4;
  }
  html, body {
    margin: 0;
    padding: 0;
    color: var(--ink);
    background: var(--screen-bg);
    font-family: "Lexend", "Segoe UI", Verdana, Arial, sans-serif;
  }
  .topbar {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 20px 8px;
    color: #4a4459;
    font-size: 13px;
    line-height: 1.35;
  }
  .topbar a { color: #6d4aff; text-decoration: none; }
  .topbar a:hover { text-decoration: underline; }
  .topbar p { margin: 6px 0 0; }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    justify-content: center;
    max-width: 1120px;
    margin: 0 auto 12px;
    padding: 10px 12px;
    background: rgba(255,255,255,.96);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(54,38,110,.08);
  }
  .control {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    font-size: 12px;
    color: #3b3448;
  }
  .control strong { min-width: 68px; font-weight: 700; }
  .control output {
    min-width: 44px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: #39246e;
    font-weight: 700;
  }
  button {
    appearance: none;
    border: 1px solid #d7d0ec;
    background: #fff;
    color: #2d2540;
    border-radius: 9px;
    padding: 5px 8px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #f3efff; }
  button.primary {
    border-color: #6d4aff;
    background: #6d4aff;
    color: white;
    font-weight: 700;
  }
  .page-note {
    min-width: 86px;
    text-align: center;
    font-size: 12px;
    color: #6b5f78;
  }
  #pages {
    display: grid;
    gap: 18px;
    justify-content: center;
    padding: 0 18px 36px;
  }
  .print-page {
    width: var(--page-w);
    height: var(--page-h);
    padding: var(--tweak-margin-y) var(--tweak-margin-x);
    background: var(--paper-bg);
    border: 1px solid #ded8ef;
    box-shadow: 0 5px 22px rgba(54,38,110,.14);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .page-head { flex: 0 0 auto; }
  .banner {
    display: flex;
    align-items: baseline;
    justify-content: center;
    margin: 0 0 5px 0;
    padding: 3px 0;
    border-radius: 10px;
    background: linear-gradient(90deg, #ffe066 0%, #ff8787 25%, #f783ac 50%, #9775fa 75%, #4dabf7 100%);
  }
  .banner h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    color: #1c1c28;
    background: #fff;
    padding: 4px 12px;
    border-radius: 8px;
    text-align: center;
  }
  .hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .flow {
    flex: 1 1 auto;
    min-height: 0;
    height: 0;
    column-count: var(--tweak-columns);
    column-gap: var(--tweak-gap);
    column-fill: auto;
    overflow: hidden;
  }
  .entry {
    display: grid;
    grid-template-columns: 14px minmax(0, 58%) 1fr;
    column-gap: 5px;
    align-items: baseline;
    break-inside: avoid;
    page-break-inside: avoid;
    -webkit-column-break-inside: avoid;
    padding: 2px 3px;
    border-bottom: 0.5px dotted #ddd;
    border-left: 2.5px solid var(--c, #ccc);
    margin: 0 0 0.5px;
    font-size: var(--tweak-font-size);
    line-height: var(--tweak-line-height);
  }
  .l {
    font-size: 0.78em;
    color: #888;
    font-weight: 600;
  }
  .g {
    font-family: "Gentium Plus", "Cambria", "Georgia", serif;
    font-weight: 700;
    color: #1c1c28;
    overflow-wrap: anywhere;
  }
  .d {
    min-height: 1em;
    border-left: 1px dashed #c3c3cf;
    padding-left: 4px;
  }
  .d.blank {
    align-self: stretch;
    border-bottom: 1.2px dotted #9c96ab;
  }
  .screen-page-number {
    position: absolute;
    right: 6mm;
    bottom: 3mm;
    color: #b0a9bf;
    font-size: 10px;
  }
  /* lesson colour accents */
  .L2  { --c: #ff6b6b; }
  .L3  { --c: #ffa94d; }
  .L4  { --c: #ffd43b; }
  .L6  { --c: #94d82d; }
  .L7  { --c: #20c997; }
  .L8  { --c: #22b8cf; }
  .L9  { --c: #4dabf7; }
  .L11 { --c: #748ffc; }
  .L12 { --c: #9775fa; }
  .L13 { --c: #da77f2; }
  .L14 { --c: #f783ac; }
  .L16 { --c: #ff8787; }
  .L17 { --c: #63e6be; }
  .L18 { --c: #74c0fc; }
  .L19 { --c: #b197fc; }
  template { display: none; }

  @page { size: A4 landscape; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .topbar, .toolbar { display: none !important; }
    #pages { display: block; padding: 0; }
    .print-page {
      width: 297mm;
      height: 210mm;
      border: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .print-page:last-child { page-break-after: auto; break-after: auto; }
    .screen-page-number { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="vocab-greek-nl-print-all.html">Terug naar menu</a>
    <p>Zelftoets: vul de Nederlandse vertaling in op de gestippelde lijn. De pagina's hieronder worden opnieuw opgebouwd wanneer je lettergrootte of kolommen wijzigt.</p>
  </div>

  <div class="toolbar" aria-label="Printinstellingen">
    <span class="control"><strong>Letter</strong><button type="button" data-action="font-down">A-</button><output id="fontOut"></output><button type="button" data-action="font-up">A+</button></span>
    <span class="control"><strong>Kolommen</strong><button type="button" data-action="cols-down">-</button><output id="colsOut"></output><button type="button" data-action="cols-up">+</button></span>
    <span class="control"><strong>Regel</strong><button type="button" data-action="line-down">-</button><output id="lineOut"></output><button type="button" data-action="line-up">+</button></span>
    <span class="control"><strong>Marge</strong><button type="button" data-action="margin-down">-</button><output id="marginOut"></output><button type="button" data-action="margin-up">+</button></span>
    <span class="page-note" id="pageOut"></span>
    <button type="button" data-action="reset">Reset</button>
    <button type="button" class="primary" data-action="print">Print</button>
  </div>

  <main id="pages" aria-live="polite"></main>

<script>
(function () {
  const defaults = { font: 12.6, line: 1.18, cols: 6, margin: 7, gap: 10 };
  const limits = {
    font: [8, 22],
    line: [1.02, 1.55],
    cols: [2, 8],
    margin: [3, 18]
  };
  const key = 'greek-nl-selftest-print-v1';
  const root = document.documentElement;
  const pages = document.getElementById('pages');
  const source = document.getElementById('entrySource');
  const outs = {
    font: document.getElementById('fontOut'),
    line: document.getElementById('lineOut'),
    cols: document.getElementById('colsOut'),
    margin: document.getElementById('marginOut'),
    page: document.getElementById('pageOut')
  };
  let state = loadState();
  let scheduled = false;

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

  function loadState() {
    try {
      return Object.assign({}, defaults, JSON.parse(localStorage.getItem(key) || '{}'));
    } catch (e) {
      return Object.assign({}, defaults);
    }
  }

  function saveState() {
    localStorage.setItem(key, JSON.stringify(state));
  }

  function applyState() {
    state.font = clamp(Number(state.font) || defaults.font, limits.font[0], limits.font[1]);
    state.line = clamp(Number(state.line) || defaults.line, limits.line[0], limits.line[1]);
    state.cols = Math.round(clamp(Number(state.cols) || defaults.cols, limits.cols[0], limits.cols[1]));
    state.margin = clamp(Number(state.margin) || defaults.margin, limits.margin[0], limits.margin[1]);
    root.style.setProperty('--tweak-font-size', state.font.toFixed(1) + 'px');
    root.style.setProperty('--tweak-line-height', state.line.toFixed(2));
    root.style.setProperty('--tweak-columns', String(state.cols));
    root.style.setProperty('--tweak-margin-x', state.margin.toFixed(0) + 'mm');
    root.style.setProperty('--tweak-margin-y', state.margin.toFixed(0) + 'mm');
    root.style.setProperty('--tweak-gap', state.gap + 'px');
    outs.font.textContent = state.font.toFixed(1) + 'px';
    outs.line.textContent = state.line.toFixed(2);
    outs.cols.textContent = String(state.cols);
    outs.margin.textContent = state.margin.toFixed(0) + 'mm';
  }

  function getEntries() {
    return Array.from(source.content.querySelectorAll('.entry')).map(el => el.cloneNode(true));
  }

  function makePage(pageNo) {
    const page = document.createElement('section');
    page.className = 'print-page';
    page.setAttribute('aria-label', 'Pagina ' + pageNo);
    if (pageNo === 1) {
      const head = document.createElement('div');
      head.className = 'page-head';
      head.innerHTML = '<div class="banner"><h1>🏛️ Grieks naar Nederlands - zelftoets</h1></div><p class="hint">Schrijf de Nederlandse vertaling op de stippellijn.</p>';
      page.appendChild(head);
    }
    const flow = document.createElement('div');
    flow.className = 'flow';
    page.appendChild(flow);
    const n = document.createElement('div');
    n.className = 'screen-page-number';
    n.textContent = 'pagina ' + pageNo;
    page.appendChild(n);
    return { page, flow };
  }

  function overflows(flow) {
    return flow.scrollWidth > flow.clientWidth + 2 || flow.scrollHeight > flow.clientHeight + 2;
  }

  function paginate() {
    scheduled = false;
    applyState();
    pages.innerHTML = '';
    const entries = getEntries();
    let i = 0;
    let pageNo = 1;
    while (i < entries.length) {
      const { page, flow } = makePage(pageNo);
      pages.appendChild(page);
      let added = 0;
      while (i < entries.length) {
        const item = entries[i].cloneNode(true);
        flow.appendChild(item);
        if (overflows(flow)) {
          flow.removeChild(item);
          break;
        }
        i += 1;
        added += 1;
      }
      if (added === 0 && i < entries.length) {
        flow.appendChild(entries[i].cloneNode(true));
        i += 1;
      }
      pageNo += 1;
      if (pageNo > 20) break;
    }
    outs.page.textContent = (pageNo - 1) + ' pagina' + ((pageNo - 1) === 1 ? '' : "'s");
  }

  function schedulePaginate() {
    applyState();
    saveState();
    if (!scheduled) {
      scheduled = true;
      requestAnimationFrame(() => requestAnimationFrame(paginate));
    }
  }

  document.querySelector('.toolbar').addEventListener('click', (ev) => {
    const action = ev.target && ev.target.getAttribute('data-action');
    if (!action) return;
    if (action === 'font-down') state.font -= 0.5;
    if (action === 'font-up') state.font += 0.5;
    if (action === 'cols-down') state.cols -= 1;
    if (action === 'cols-up') state.cols += 1;
    if (action === 'line-down') state.line -= 0.03;
    if (action === 'line-up') state.line += 0.03;
    if (action === 'margin-down') state.margin -= 1;
    if (action === 'margin-up') state.margin += 1;
    if (action === 'reset') state = Object.assign({}, defaults);
    if (action === 'print') { window.print(); return; }
    schedulePaginate();
  });

  window.addEventListener('resize', schedulePaginate);
  applyState();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(paginate);
  } else {
    paginate();
  }
}());
</script>
