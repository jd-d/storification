<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Werkwoordspelling Oefenen</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        .verb-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .home-link {
            font-weight: 700;
            color: #1d4ed8;
            text-decoration: none;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        .progress-note {
            margin: 0 0 20px;
            font-size: 0.9em;
            color: #4b5563;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .score-display {
            font-size: 0.9em;
            color: #374151;
        }

        .sentence-box {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1.2em;
            line-height: 1.6;
        }

        .infinitive {
            color: #374151;
            font-style: italic;
            margin-bottom: 15px;
        }

        .tense-hint {
            background: #dbeafe;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #1e3a8a;
        }

        .answer-section {
            margin-bottom: 20px;
        }

        .answer-input {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .answer-input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .answer-input::placeholder {
            color: #6b7280;
            opacity: 1;
        }

        .answer-input.correct {
            border-color: #4CAF50;
            background: #e8f5e9;
        }

        .answer-input.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }

        .nav-btn.primary {
            background: #2563eb;
            color: white;
        }

        .nav-btn.primary:hover {
            background: #1d4ed8;
        }

        .nav-btn.secondary {
            background: #e5e7eb;
            color: #333;
        }

        .nav-btn.secondary:hover {
            background: #d1d5db;
        }

        .nav-btn.finish {
            background: #16a34a;
            color: white;
        }

        .nav-btn.finish:hover {
            background: #15803d;
        }

        .nav-btn.danger {
            background: #dc2626;
            color: white;
        }

        .nav-btn.danger:hover {
            background: #b91c1c;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 5px;
            margin: 20px 0;
        }

        .q-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            cursor: pointer;
            border: 2px solid #cbd5e1;
            background: white;
            color: #111827;
            transition: all 0.2s;
        }

        .q-dot:hover {
            transform: scale(1.1);
        }

        .q-dot.current {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
        }

        .q-dot.answered {
            background: #e0f2fe;
        }

        .q-dot.correct {
            background: #e8f5e9;
            border-color: #4CAF50;
        }

        .q-dot.incorrect {
            background: #ffebee;
            border-color: #f44336;
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .results-score {
            font-size: 3em;
            font-weight: bold;
            color: #2563eb;
        }

        .results-detail {
            color: #4b5563;
        }

        .wrong-answer {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .wrong-answer .sentence {
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .wrong-answer .your-answer {
            color: #c62828;
        }

        .wrong-answer .correct-answer {
            color: #2e7d32;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="verb-container">
        <div class="title-bar">
            <a href="../../index.html" class="home-link" id="home-link">Storification</a>
            <button class="nav-btn danger" id="reset-all-btn" type="button">Reset hele quiz</button>
        </div>

        <h1>Werkwoordspelling Oefenen</h1>
        <p class="progress-note">Je voortgang wordt automatisch opgeslagen.</p>

        <!-- Quiz View -->
        <div id="quiz-view">
            <div class="question-header">
                <span id="question-number">Vraag 1/53</span>
                <span class="score-display" id="score-display">Score: 0/0</span>
            </div>

            <div class="sentence-box" id="sentence-box">
                Ik ........ elke dag naar school.
            </div>

            <div class="infinitive" id="infinitive">
                Infinitief: <strong>fietsen</strong>
            </div>

            <div class="tense-hint" id="tense-hint">
                Tijd: <strong>tegenwoordige tijd</strong>
            </div>

            <div class="answer-section">
                <input type="text" class="answer-input" id="answer-input" placeholder="Typ hier het werkwoord..."
                    autocomplete="off" autocapitalize="off" />
                <div class="feedback hidden" id="feedback"></div>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn secondary" id="prev-btn" disabled>← Vorige</button>
                <button class="nav-btn primary" id="next-btn">Volgende →</button>
                <button class="nav-btn secondary" id="reset-btn">Wis antwoord</button>
                <button class="nav-btn finish" id="finish-btn">Klaar</button>
            </div>

            <details>
                <summary style="cursor: pointer; margin-bottom: 10px;">Overzicht (klik om te openen)</summary>
                <div class="question-grid" id="question-grid"></div>
            </details>
        </div>

        <!-- Results View -->
        <div id="results-view" class="hidden">
            <div class="results-header">
                <div class="results-score" id="final-score">0/53</div>
                <div class="results-detail" id="results-detail">0 goed, 0 fout, 0 niet ingevuld</div>
            </div>

            <h2>Foute of lege antwoorden:</h2>
            <div id="wrong-answers"></div>

            <div class="nav-buttons" style="margin-top: 30px;">
                <button class="nav-btn primary" id="retry-btn">Opnieuw proberen</button>
                <button class="nav-btn secondary" id="back-to-quiz-btn">Terug naar quiz</button>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script>
        const QUESTIONS = window.QUESTIONS || [];

        let answers = new Array(QUESTIONS.length).fill(null);
        let currentIndex = 0;
        let isFinished = false;
        const STORAGE_KEY = "werkwoorden-quiz-state-v1";

        function saveState() {
            if (isFinished || QUESTIONS.length === 0) return;
            const state = {
                answers,
                currentIndex,
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function clearState() {
            localStorage.removeItem(STORAGE_KEY);
        }

        function loadState() {
            if (QUESTIONS.length === 0) return;
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            try {
                const state = JSON.parse(raw);
                if (!state || !Array.isArray(state.answers)) {
                    clearState();
                    return;
                }
                if (state.answers.length !== QUESTIONS.length) {
                    clearState();
                    return;
                }
                answers = state.answers.map((value) => (value === null ? null : String(value)));
                const idx = Number(state.currentIndex);
                if (Number.isInteger(idx)) {
                    currentIndex = Math.min(Math.max(idx, 0), QUESTIONS.length - 1);
                }
            } catch (error) {
                clearState();
            }
        }

        // DOM elements
        const quizView = document.getElementById('quiz-view');
        const resultsView = document.getElementById('results-view');
        const questionNumber = document.getElementById('question-number');
        const scoreDisplay = document.getElementById('score-display');
        const sentenceBox = document.getElementById('sentence-box');
        const infinitive = document.getElementById('infinitive');
        const tenseHint = document.getElementById('tense-hint');
        const answerInput = document.getElementById('answer-input');
        const feedback = document.getElementById('feedback');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetBtn = document.getElementById('reset-btn');
        const finishBtn = document.getElementById('finish-btn');
        const questionGrid = document.getElementById('question-grid');
        const finalScore = document.getElementById('final-score');
        const resultsDetail = document.getElementById('results-detail');
        const wrongAnswers = document.getElementById('wrong-answers');
        const retryBtn = document.getElementById('retry-btn');
        const backToQuizBtn = document.getElementById('back-to-quiz-btn');
        const resetAllBtn = document.getElementById('reset-all-btn');
        const homeLink = document.getElementById('home-link');

        function stripDiacritics(s) {
            return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function normalize(s) {
            return stripDiacritics(s.trim()).toLowerCase();
        }

        function isCorrect(index) {
            const a = answers[index];
            if (a === null) return false;
            return normalize(a) === normalize(QUESTIONS[index].answer);
        }

        function getScore() {
            let correct = 0;
            let answered = 0;
            for (let i = 0; i < QUESTIONS.length; i++) {
                if (answers[i] !== null) {
                    answered++;
                    if (isCorrect(i)) correct++;
                }
            }
            return { correct, answered };
        }

        function buildQuestionGrid() {
            questionGrid.innerHTML = '';
            for (let i = 0; i < QUESTIONS.length; i++) {
                const dot = document.createElement('button');
                dot.className = 'q-dot';
                dot.textContent = i + 1;

                if (i === currentIndex) dot.classList.add('current');
                if (answers[i] !== null) {
                    dot.classList.add('answered');
                    if (isCorrect(i)) {
                        dot.classList.add('correct');
                    } else {
                        dot.classList.add('incorrect');
                    }
                }

                dot.addEventListener('click', () => {
                    goToQuestion(i);
                });

                questionGrid.appendChild(dot);
            }
        }

        function updateDisplay() {
            const q = QUESTIONS[currentIndex];
            const { correct, answered } = getScore();

            questionNumber.textContent = `Vraag ${currentIndex + 1}/${QUESTIONS.length}`;
            scoreDisplay.textContent = `Score: ${correct}/${answered}`;
            sentenceBox.textContent = q.sentence;
            infinitive.innerHTML = `Infinitief: <strong>${q.inf}</strong>`;
            tenseHint.innerHTML = `Tijd: <strong>${q.tense}</strong>`;

            // Update input
            answerInput.value = answers[currentIndex] || '';
            answerInput.className = 'answer-input';
            feedback.className = 'feedback hidden';
            feedback.textContent = '';

            if (answers[currentIndex] !== null) {
                if (isCorrect(currentIndex)) {
                    answerInput.classList.add('correct');
                    feedback.className = 'feedback correct';
                    feedback.textContent = '✓ Goed!';
                } else {
                    answerInput.classList.add('incorrect');
                    feedback.className = 'feedback incorrect';
                    feedback.textContent = `✗ Fout. Het juiste antwoord is: ${q.answer}`;
                }
            }

            // Update nav buttons
            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === QUESTIONS.length - 1 ? 'Klaar' : 'Volgende →';

            buildQuestionGrid();
            saveState();
        }

        function goToQuestion(index) {
            if (index >= 0 && index < QUESTIONS.length) {
                currentIndex = index;
                updateDisplay();
                answerInput.focus();
            }
        }

        function submitAnswer() {
            const value = answerInput.value.trim();
            answers[currentIndex] = value ? value : null;
        }

        function showResults() {
            const { correct, answered } = getScore();
            const unanswered = QUESTIONS.length - answered;
            const wrong = answered - correct;

            quizView.classList.add('hidden');
            resultsView.classList.remove('hidden');

            finalScore.textContent = `${correct}/${QUESTIONS.length}`;
            resultsDetail.textContent = `${correct} goed, ${wrong} fout, ${unanswered} niet ingevuld`;

            wrongAnswers.innerHTML = '';
            let anyWrong = false;

            for (let i = 0; i < QUESTIONS.length; i++) {
                if (answers[i] === null || !isCorrect(i)) {
                    anyWrong = true;
                    const q = QUESTIONS[i];
                    const div = document.createElement('div');
                    div.className = 'wrong-answer';
                    div.innerHTML = `
            <div class="sentence"><strong>${i + 1}.</strong> ${q.sentence} <em>(${q.inf})</em></div>
            <div>Tijd: ${q.tense}</div>
            <div class="your-answer">Jouw antwoord: ${answers[i] || '[leeg]'}</div>
            <div class="correct-answer">Goed: ${q.answer}</div>
          `;
                    wrongAnswers.appendChild(div);
                }
            }

            if (!anyWrong) {
                wrongAnswers.innerHTML = '<p style="color: #2e7d32; font-weight: bold;">🎉 Alles goed! Fantastisch!</p>';
            }

            isFinished = true;
            clearState();
        }

        function resetAllQuiz() {
            answers = new Array(QUESTIONS.length).fill(null);
            currentIndex = 0;
            isFinished = false;
            clearState();
            resultsView.classList.add('hidden');
            quizView.classList.remove('hidden');
            updateDisplay();
            answerInput.focus();
        }

        // Event listeners
        answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                submitAnswer();
                if (currentIndex < QUESTIONS.length - 1) {
                    goToQuestion(currentIndex + 1);
                } else {
                    showResults();
                }
            }
        });

        answerInput.addEventListener('input', () => {
            // Clear feedback styling while typing
            if (answers[currentIndex] !== null) {
                // Keep showing result
            }
        });

        prevBtn.addEventListener('click', () => {
            submitAnswer();
            goToQuestion(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            submitAnswer();
            if (currentIndex < QUESTIONS.length - 1) {
                goToQuestion(currentIndex + 1);
            } else {
                showResults();
            }
        });

        resetBtn.addEventListener('click', () => {
            answers[currentIndex] = null;
            updateDisplay();
            answerInput.focus();
        });

        finishBtn.addEventListener('click', () => {
            submitAnswer();
            showResults();
        });

        retryBtn.addEventListener('click', () => {
            resetAllQuiz();
        });

        backToQuizBtn.addEventListener('click', () => {
            resultsView.classList.add('hidden');
            quizView.classList.remove('hidden');
            updateDisplay();
            answerInput.focus();
        });

        resetAllBtn.addEventListener('click', () => {
            if (confirm('Weet je zeker dat je alles wilt resetten?')) {
                resetAllQuiz();
            }
        });

        homeLink.addEventListener('click', () => {
            submitAnswer();
            saveState();
        });

        window.addEventListener('beforeunload', () => {
            submitAnswer();
            saveState();
        });

        // Initialize
        loadState();
        updateDisplay();
        answerInput.focus();
    </script>
</body>

</html>
